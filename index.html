<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='7' r='5' fill='%23fff4c8'/><circle cx='10' cy='6' r='5' fill='%230b1026'/></svg>">
<title>Touch Grass</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1026; color: #f6ecd6; font-family: Georgia, serif; overflow: hidden; }
  #intro { position: fixed; left: 16px; top: 16px; max-width: 320px; padding: 10px 14px; border-radius: 12px; background: rgba(11,16,38,.55); backdrop-filter: blur(6px); transition: opacity .8s ease; pointer-events: none; }
  #intro h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  #intro p { margin: 4px 0 0; font-size: 12px; opacity: .8; }
  #intro.faded { opacity: 0; }
  html, body, canvas { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="intro">
  <h1>Touch Grass</h1>
  <p>Brush the grass · touch the pond &amp; trees · tap the gold corner · pen over words · scroll to look</p>
</div>
<button id="skybtn" style="position:fixed;right:16px;top:16px;z-index:5;padding:10px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(11,16,38,.75);color:#f6ecd6;font:15px Georgia,serif;cursor:pointer">☁  Look at the sky</button>
<script>setTimeout(()=>document.getElementById("intro").classList.add("faded"),7000)</script>
<script type="module" src="./main.js?v=touch13"></script>
</body>
</html>
